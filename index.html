<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>深渊试炼 · Abyss Trial</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", system-ui, sans-serif;
    background: #08060c;
    color: #e9e6f2;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 背景 ---------- */
  .bg-base, .bg-grid, .bg-vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bg-base {
    background:
      radial-gradient(700px 640px at 30% 47%, rgba(245, 196, 81, .16), transparent 64%),
      radial-gradient(700px 640px at 70% 47%, rgba(196, 54, 86, .20), transparent 64%),
      radial-gradient(1100px 700px at 50% 120%, rgba(92, 62, 168, .24), transparent 72%),
      linear-gradient(#0c0913, #08060c 55%);
  }
  .bg-grid {
    background-image:
      linear-gradient(rgba(255, 255, 255, .028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .028) 1px, transparent 1px);
    background-size: 52px 52px;
    -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 10%, transparent 72%);
    mask-image: radial-gradient(circle at 50% 42%, #000 10%, transparent 72%);
  }
  .bg-vignette {
    background: radial-gradient(circle at 50% 45%, transparent 45%, rgba(4, 2, 8, .78) 100%);
  }

  /* ---------- 布局骨架 ---------- */
  #app {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 1.8vw, 26px);
    gap: clamp(6px, 1.2vh, 16px);
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 auto;
  }

  .wave-block { display: flex; align-items: baseline; gap: 10px; }
  .wave-label {
    font-size: clamp(9px, .9vw, 11px);
    letter-spacing: .34em;
    color: #7d7893;
    font-weight: 700;
    text-transform: uppercase;
  }
  .wave-num {
    font-size: clamp(24px, 3.2vw, 38px);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff, #b9a7e8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: transform .3s;
  }
  .wave-num.bump { animation: bump .45s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.28); }
    100% { transform: scale(1); }
  }

  .top-right { display: flex; align-items: center; gap: 8px; }

  .record {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: #7d7893;
    letter-spacing: .12em;
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(245, 196, 81, .07);
    border: 1px solid rgba(245, 196, 81, .16);
    font-variant-numeric: tabular-nums;
  }
  .record b { color: #f5c451; font-weight: 800; font-size: 12px; }

  .icon-btn {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .08);
    color: #b9b4cc;
    font-size: 15px;
    cursor: pointer;
    transition: background .18s, transform .18s, color .18s;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, .1); color: #fff; }
  .icon-btn:active { transform: scale(.92); }

  /* ---------- 战斗舞台 ---------- */
  .stage {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 9vw, 210px);
    position: relative;
    min-height: 0;
  }

  .fighter {
    flex: 0 1 auto;
    width: clamp(170px, 23vw, 286px);
    min-height: clamp(240px, 43vh, 392px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.1vh, 12px);
    padding: clamp(14px, 2.4vh, 26px) clamp(11px, 1.2vw, 18px) clamp(14px, 2.2vh, 22px);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .072), rgba(255, 255, 255, .014));
    border: 1px solid rgba(255, 255, 255, .09);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    position: relative;
    will-change: transform;
  }

  .fighter::before {
    content: '';
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    width: 118%;
    height: 58px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(245, 196, 81, .28), rgba(245, 196, 81, .06) 45%, transparent 72%);
    filter: blur(9px);
    pointer-events: none;
    z-index: 0;
  }
  .foe::before { background: radial-gradient(ellipse, rgba(255, 60, 100, .28), rgba(255, 60, 100, .06) 45%, transparent 72%); }
  .foe.boss::before { background: radial-gradient(ellipse, rgba(245, 196, 81, .32), rgba(245, 196, 81, .07) 45%, transparent 72%); }

  .stage::after {
    content: '';
    position: absolute;
    left: -12%;
    right: -12%;
    bottom: -40px;
    height: 300px;
    background: radial-gradient(ellipse 52% 100% at 50% 100%, rgba(112, 82, 190, .16), transparent 72%);
    pointer-events: none;
    z-index: -1;
  }

  .ally {
    box-shadow: 0 0 0 1px rgba(245, 196, 81, .12), 0 24px 60px -26px rgba(245, 196, 81, .45);
  }
  .foe {
    box-shadow: 0 0 0 1px rgba(255, 84, 116, .12), 0 24px 60px -26px rgba(220, 40, 80, .5);
  }
  .foe.boss {
    border-color: rgba(245, 196, 81, .45);
    box-shadow: 0 0 0 1px rgba(245, 196, 81, .4), 0 0 46px -6px rgba(245, 196, 81, .35), 0 24px 60px -26px rgba(220, 40, 80, .5);
  }

  .name-row {
    display: flex;
    align-items: center;
    gap: 5px;
    max-width: 100%;
  }
  .name {
    font-size: clamp(12px, 1.1vw, 14px);
    font-weight: 700;
    letter-spacing: .03em;
    color: #ded9ee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .foe .name { color: #f0c3cf; }
  .crown { font-size: clamp(11px, 1.1vw, 14px); }

  .avatar-wrap {
    position: relative;
    display: grid;
    place-items: center;
  }
  .aura {
    position: absolute;
    width: 150%; height: 150%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 196, 81, .26), transparent 68%);
    filter: blur(6px);
    animation: breathe 3.4s ease-in-out infinite;
  }
  .foe .aura { background: radial-gradient(circle, rgba(226, 46, 88, .3), transparent 68%); }
  .foe.boss .aura { background: radial-gradient(circle, rgba(245, 196, 81, .34), transparent 68%); }
  @keyframes breathe {
    0%, 100% { transform: scale(.94); opacity: .75; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .avatar {
    width: clamp(78px, 9.6vw, 122px);
    height: clamp(78px, 9.6vw, 122px);
    display: grid;
    place-items: center;
    font-size: clamp(40px, 5.4vw, 66px);
    line-height: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 34%, rgba(255, 255, 255, .14), rgba(0, 0, 0, .36));
    border: 1px solid rgba(255, 255, 255, .11);
    position: relative;
    z-index: 2;
    transition: filter .2s;
  }
  .foe .avatar { filter: brightness(1.14) saturate(1.08); }
  .foe.boss .avatar {
    font-size: clamp(46px, 6vw, 74px);
    border-color: rgba(245, 196, 81, .34);
  }

  /* 血条 */
  .bar {
    width: 100%;
    height: clamp(13px, 1.6vh, 18px);
    border-radius: 99px;
    background: rgba(0, 0, 0, .52);
    border: 1px solid rgba(255, 255, 255, .08);
    position: relative;
    overflow: hidden;
  }
  .bar-ghost, .fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    border-radius: 99px;
  }
  .bar-ghost {
    background: rgba(255, 255, 255, .16);
    transition: width .62s cubic-bezier(.3, .9, .3, 1) .16s;
  }
  .fill {
    background: linear-gradient(90deg, #ff8a6b, #ff2d55 78%);
    box-shadow: 0 0 12px rgba(255, 45, 85, .55);
    transition: width .34s cubic-bezier(.2, .9, .3, 1);
  }
  .foe .fill {
    background: linear-gradient(90deg, #b45cff, #6d28d9 82%);
    box-shadow: 0 0 12px rgba(139, 92, 246, .55);
  }
  .foe.boss .fill {
    background: linear-gradient(90deg, #ffdb70, #f5a623 82%);
    box-shadow: 0 0 14px rgba(245, 196, 81, .6);
  }
  .bar.low .fill { animation: lowPulse 1s ease-in-out infinite; }
  @keyframes lowPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.55); }
  }
  .bar-txt {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(9px, .9vw, 10.5px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .03em;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .95);
    z-index: 3;
  }

  /* 护盾条 */
  .shield-bar {
    width: 100%;
    height: 7px;
    border-radius: 99px;
    background: rgba(10, 26, 40, .72);
    border: 1px solid rgba(110, 190, 255, .26);
    overflow: hidden;
    margin-top: -2px;
    opacity: 0;
    transition: opacity .25s;
  }
  .shield-bar.on { opacity: 1; }
  .shield-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, #9fe0ff, #3b9dff);
    box-shadow: 0 0 10px rgba(80, 180, 255, .8);
    transition: width .3s cubic-bezier(.2,.9,.3,1);
  }

  .stats {
    display: flex;
    gap: clamp(6px, .8vw, 12px);
    width: 100%;
    justify-content: center;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: clamp(10px, .95vw, 12px);
    font-variant-numeric: tabular-nums;
    padding: 2px 7px;
    border-radius: 7px;
    background: rgba(0, 0, 0, .3);
    border: 1px solid rgba(255, 255, 255, .05);
  }
  .stat i { font-style: normal; font-size: .92em; opacity: .9; }
  .stat b { font-weight: 700; letter-spacing: .02em; }
  .stat.atk b { color: #ffb08a; }
  .stat.def b { color: #8ecbff; }
  .stat.up { animation: statPop .5s cubic-bezier(.2,.9,.3,1.6); }
  @keyframes statPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); background: rgba(120, 255, 190, .18); }
    100% { transform: scale(1); }
  }

  /* 装备栏 */
  .eq-row {
    display: flex;
    gap: 4px;
    width: 100%;
    justify-content: center;
  }
  .eq-slot {
    flex: 0 1 30px;
    min-width: 0;
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: rgba(0, 0, 0, .32);
    border: 1px solid rgba(255, 255, 255, .06);
    font-size: clamp(11px, 1.1vw, 14px);
    line-height: 1;
    position: relative;
    opacity: .45;
    transition: opacity .25s, border-color .25s, box-shadow .25s;
  }
  .eq-slot.filled {
    opacity: 1;
    border-color: var(--c);
    background: rgba(0, 0, 0, .45);
    box-shadow: 0 0 9px -2px var(--c), inset 0 0 8px -5px var(--c);
  }
  .eq-lv {
    position: absolute;
    right: 1px;
    bottom: 0px;
    font-size: 7px;
    font-weight: 800;
    line-height: 1;
    color: #0a0810;
    background: var(--c, #888);
    border-radius: 3px;
    padding: 1px 2px;
  }
  .eq-slot.filled.just { animation: slotPop .55s cubic-bezier(.2,.9,.3,1.7); }
  @keyframes slotPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.28); }
    100% { transform: scale(1); }
  }

  /* 状态 */
  .status-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    min-height: 0;
  }
  .status-row:empty { display: none; }
  .st-chip {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: clamp(8.5px, .8vw, 10px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 1px 5px;
    border-radius: 5px;
    letter-spacing: .02em;
    animation: chipIn .3s cubic-bezier(.2,.9,.3,1.5);
  }
  @keyframes chipIn {
    from { transform: scale(.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .st-bleed { color: #ff8fa3; background: rgba(255, 60, 90, .16); border: 1px solid rgba(255, 60, 90, .38); }

  /* 中间 */
  .center {
    flex: 0 0 auto;
    width: clamp(54px, 7vw, 96px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    align-self: stretch;
  }
  .vs {
    position: relative;
    font-size: clamp(17px, 2vw, 28px);
    font-weight: 900;
    letter-spacing: .1em;
    color: rgba(255, 255, 255, .26);
    text-shadow: 0 0 34px rgba(255, 255, 255, .22), 0 0 70px rgba(180, 150, 255, .3);
  }
  .vs::before {
    content: '';
    position: absolute;
    inset: -46px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168, 140, 255, .16), transparent 62%);
    pointer-events: none;
    z-index: -1;
  }
  .center-line {
    width: 1px;
    height: 18%;
    background: linear-gradient(transparent, rgba(255, 255, 255, .16), transparent);
  }
  .turn-tip {
    font-size: clamp(9px, .85vw, 10.5px);
    color: #6b6685;
    letter-spacing: .1em;
    text-align: center;
    min-height: 14px;
    transition: opacity .3s;
    line-height: 1.5;
  }
  .turn-tip.warn { color: #ff8a6b; }

  .impact {
    position: absolute;
    left: 50%; top: 44%;
    width: 0; height: 0;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
  }
  .impact.fire {
    animation: impactBurst .42s ease-out forwards;
    background: radial-gradient(circle, rgba(255, 236, 190, .9), rgba(255, 120, 90, .35) 45%, transparent 70%);
  }
  .impact.fire.red {
    background: radial-gradient(circle, rgba(255, 180, 200, .9), rgba(255, 60, 100, .35) 45%, transparent 70%);
  }
  @keyframes impactBurst {
    0% { width: 0; height: 0; opacity: 1; }
    55% { width: 220px; height: 220px; opacity: .9; }
    100% { width: 300px; height: 300px; opacity: 0; }
  }

  /* ---------- 波次进度 ---------- */
  .track {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1vw, 14px);
  }
  .track-pips { display: flex; align-items: center; gap: 6px; }
  .pip {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .13);
    transition: background .35s, box-shadow .35s, transform .35s;
  }
  .pip.on {
    background: #f5c451;
    box-shadow: 0 0 9px rgba(245, 196, 81, .85);
  }
  .pip.boss-pip {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    transform: rotate(45deg);
    background: rgba(245, 196, 81, .28);
    margin-left: 2px;
  }
  .pip.boss-pip.on {
    background: #f5c451;
    box-shadow: 0 0 14px rgba(245, 196, 81, 1);
  }
  .track-label {
    font-size: clamp(9px, .85vw, 10.5px);
    color: #6f6a85;
    letter-spacing: .14em;
    font-variant-numeric: tabular-nums;
    min-width: 68px;
    transition: color .3s;
  }
  .track-label.warn { color: #f5c451; text-shadow: 0 0 12px rgba(245, 196, 81, .7); }

  /* ---------- 底部操作 ---------- */
  .actions {
    flex: 0 0 auto;
    display: flex;
    gap: clamp(8px, 1.2vw, 14px);
    justify-content: center;
    padding-bottom: clamp(2px, 1vh, 10px);
  }

  .btn {
    position: relative;
    border: none;
    border-radius: 14px;
    padding: clamp(11px, 1.6vh, 16px) clamp(20px, 4vw, 52px);
    font-family: inherit;
    font-size: clamp(13px, 1.25vw, 16px);
    font-weight: 800;
    letter-spacing: .1em;
    color: #1a0f04;
    cursor: pointer;
    overflow: hidden;
    transition: transform .14s cubic-bezier(.2,.9,.3,1.6), box-shadow .2s, filter .2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.975); }
  .btn:disabled { cursor: not-allowed; filter: grayscale(.55) brightness(.7); }

  .btn-attack {
    background: linear-gradient(160deg, #ffe08a, #f5b53c 55%, #e08a1e);
    box-shadow: 0 8px 26px -8px rgba(245, 181, 60, .7), inset 0 1px 0 rgba(255, 255, 255, .5);
  }
  .btn-attack:hover:not(:disabled) { box-shadow: 0 12px 32px -8px rgba(245, 181, 60, .9), inset 0 1px 0 rgba(255, 255, 255, .6); }

  .btn-defend {
    background: linear-gradient(160deg, #bfe6ff, #5fb8f0 55%, #2f7fc4);
    color: #061622;
    box-shadow: 0 8px 26px -8px rgba(95, 184, 240, .6), inset 0 1px 0 rgba(255, 255, 255, .45);
  }
  .btn-defend:hover:not(:disabled) { box-shadow: 0 12px 32px -8px rgba(95, 184, 240, .85), inset 0 1px 0 rgba(255, 255, 255, .55); }
  .btn-defend .sub {
    display: block;
    font-size: .72em;
    letter-spacing: 0;
    opacity: .72;
    font-weight: 700;
    margin-top: 1px;
  }

  /* ---------- 飘字 ---------- */
  .float-num {
    position: absolute;
    left: 50%;
    top: 52%;
    font-weight: 900;
    font-size: clamp(17px, 2.5vw, 26px);
    pointer-events: none;
    white-space: nowrap;
    z-index: 6;
    animation: floatUp .92s cubic-bezier(.2, .7, .35, 1) forwards;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .9), 0 0 22px currentColor;
  }
  .float-num.dmg { color: #ffe9a3; }
  .float-num.crit { color: #ffb347; font-size: clamp(21px, 3vw, 32px); }
  .float-num.hurt { color: #ff6b81; }
  .float-num.heal { color: #6ee7a8; }
  .float-num.shield { color: #7fd8ff; }
  .float-num.dot { color: #ff8fa3; }
  .float-num.block { color: #9fe0ff; font-size: clamp(13px, 1.8vw, 19px); }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.62); }
    22% { opacity: 1; transform: translate(-50%, -36px) scale(1.16); }
    62% { opacity: 1; transform: translate(-50%, -60px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -96px) scale(.94); }
  }

  /* ---------- 动作动画 ---------- */
  @keyframes lunge {
    0% { transform: translateX(0); }
    34% { transform: translateX(30px) scale(1.035); }
    100% { transform: translateX(0); }
  }
  @keyframes lungeFoe {
    0% { transform: translateX(0); }
    34% { transform: translateX(-30px) scale(1.035); }
    100% { transform: translateX(0); }
  }
  @keyframes hitShake {
    0%, 100% { transform: translateX(0); }
    18% { transform: translateX(-9px) rotate(-1.4deg); }
    38% { transform: translateX(8px) rotate(1.2deg); }
    58% { transform: translateX(-5px); }
    78% { transform: translateX(3px); }
  }
  @keyframes dying {
    0% { transform: scale(1) rotate(0); opacity: 1; filter: brightness(1); }
    30% { filter: brightness(2.4) saturate(0); }
    100% { transform: scale(.82) rotate(-6deg); opacity: 0; filter: brightness(.6); }
  }
  @keyframes brace {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(120, 210, 255, .55); }
    40% { transform: scale(1.02); box-shadow: 0 0 0 12px rgba(120, 210, 255, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(120, 210, 255, 0); }
  }

  .ally.lunge { animation: lunge .34s cubic-bezier(.3,.8,.4,1); }
  .foe.lunge { animation: lungeFoe .34s cubic-bezier(.3,.8,.4,1); }
  .ally.hit, .foe.hit { animation: hitShake .36s cubic-bezier(.3,.8,.4,1); }
  .ally.guard, .foe.guard { animation: brace .5s cubic-bezier(.3,.8,.4,1); }
  .foe.dying { animation: dying .62s cubic-bezier(.4,0,.6,1) forwards; }

  .flash-dmg .avatar { filter: brightness(1.9) saturate(1.3); }

  /* ---------- 遮罩层 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(5, 3, 10, .66);
    -webkit-backdrop-filter: blur(11px);
    backdrop-filter: blur(11px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .32s, visibility .32s;
    overflow-y: auto;
  }
  .overlay.show { opacity: 1; visibility: visible; }

  .panel {
    width: min(980px, 100%);
    transform: translateY(16px) scale(.97);
    transition: transform .42s cubic-bezier(.2,.9,.3,1.3);
    margin: auto;
  }
  .overlay.show .panel { transform: translateY(0) scale(1); }

  .up-head { text-align: center; margin-bottom: clamp(12px, 2vh, 24px); }
  .up-kicker {
    font-size: clamp(9px, .9vw, 11px);
    letter-spacing: .4em;
    color: #f5c451;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .up-title {
    font-size: clamp(20px, 2.4vw, 28px);
    font-weight: 900;
    letter-spacing: .06em;
    margin: 0 0 6px;
    background: linear-gradient(180deg, #fff, #c7b8ef);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .up-sub {
    font-size: clamp(11px, 1vw, 12.5px);
    color: #8b85a3;
    letter-spacing: .06em;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(10px, 1.6vw, 20px);
    align-items: stretch;
  }

  .up-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: clamp(196px, 27vh, 258px);
    gap: 7px;
    padding: clamp(14px, 2.2vh, 24px) 12px clamp(13px, 2vh, 20px);
    border-radius: 16px;
    cursor: pointer;
    border: 1.5px solid var(--c, #fff);
    background: #0d0a16;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--c) 15%, #0d0a16), rgba(12, 9, 20, .94));
    box-shadow: 0 14px 40px -18px var(--c), inset 0 0 34px -14px var(--c);
    transition: transform .18s cubic-bezier(.2,.9,.3,1.5), box-shadow .22s, filter .22s;
    animation: cardIn .46s cubic-bezier(.16,1,.3,1.05) backwards;
    overflow: hidden;
  }
  .up-card:nth-child(1) { animation-delay: .06s; }
  .up-card:nth-child(2) { animation-delay: .14s; }
  .up-card:nth-child(3) { animation-delay: .22s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(26px) scale(.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .up-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--c) 26%, transparent), transparent 62%);
    opacity: .85;
    pointer-events: none;
  }

  .up-card:hover {
    transform: translateY(-6px) scale(1.025);
    box-shadow: 0 22px 54px -18px var(--c), inset 0 0 44px -12px var(--c);
  }
  .up-card:active { transform: translateY(-2px) scale(.99); }

  .up-card.picked {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 0 0 3px var(--c), 0 26px 66px -14px var(--c);
    z-index: 3;
  }
  .up-card.dim { opacity: .18; filter: grayscale(.85); transform: scale(.94); }

  .card-rar {
    font-size: clamp(9px, .85vw, 10.5px);
    font-weight: 800;
    letter-spacing: .28em;
    color: var(--c);
    text-shadow: 0 0 14px var(--c);
    position: relative;
    z-index: 2;
    text-indent: .28em;
  }
  .card-icon {
    width: clamp(28px, 3vw, 38px);
    height: clamp(28px, 3vw, 38px);
    margin: 6px 0 0;
    color: var(--c);
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 15px var(--c));
    display: grid;
    place-items: center;
    font-size: clamp(24px, 2.6vw, 32px);
    line-height: 1;
  }
  .card-icon svg { width: 100%; height: 100%; display: block; }
  .card-name {
    font-size: clamp(12px, 1.1vw, 13.5px);
    color: #e2ddf0;
    letter-spacing: .1em;
    position: relative;
    z-index: 2;
    font-weight: 700;
    text-align: center;
  }
  .card-val {
    font-size: clamp(22px, 2.7vw, 32px);
    font-weight: 900;
    letter-spacing: .01em;
    color: var(--c);
    text-shadow: 0 0 26px var(--c);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
    position: relative;
    z-index: 2;
  }
  .card-note {
    font-size: clamp(9px, .82vw, 10.5px);
    color: #86809d;
    letter-spacing: .03em;
    position: relative;
    z-index: 2;
    text-align: center;
    line-height: 1.5;
    min-height: 1.5em;
  }
  .card-tag {
    margin-top: auto;
    font-size: clamp(9px, .8vw, 10px);
    font-weight: 700;
    color: #a79fc4;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 5px;
    padding: 2px 7px;
    letter-spacing: .04em;
    position: relative;
    z-index: 2;
  }
  .card-eff {
    font-size: clamp(9.5px, .85vw, 11px);
    color: #cfc8e2;
    line-height: 1.55;
    text-align: center;
    position: relative;
    z-index: 2;
    letter-spacing: .02em;
    padding: 0 2px;
  }
  .card-eff em { font-style: normal; color: var(--c); font-weight: 700; }

  .up-card.gold { animation: cardIn .46s cubic-bezier(.16,1,.3,1.05) backwards, goldGlow 2.2s ease-in-out infinite 1s; }
  @keyframes goldGlow {
    0%, 100% { box-shadow: 0 14px 40px -18px #fbbf24, inset 0 0 34px -14px #fbbf24; }
    50% { box-shadow: 0 22px 60px -12px #fbbf24, inset 0 0 52px -8px #fbbf24; }
  }

  /* 当前属性条 */
  .cur-stats {
    display: flex;
    justify-content: center;
    gap: clamp(12px, 2.4vw, 34px);
    margin-top: clamp(12px, 2vh, 22px);
    padding-top: clamp(10px, 1.7vh, 16px);
    border-top: 1px solid rgba(255, 255, 255, .07);
    flex-wrap: wrap;
  }
  .cur-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(11px, 1vw, 12.5px);
    color: #8b85a3;
    font-variant-numeric: tabular-nums;
  }
  .cur-item b { color: #ddd8ee; font-weight: 700; }
  .cur-item i { font-style: normal; }

  /* 装备一览 */
  .eq-panel {
    margin-top: clamp(10px, 1.6vh, 16px);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(6px, .8vw, 10px);
  }
  .eq-cell {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    padding: 7px 8px;
    border-radius: 9px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .08);
    min-height: 54px;
  }
  .eq-cell.empty { opacity: .62; border-style: dashed; }
  .eq-cell-ic {
    font-size: 15px;
    line-height: 1.2;
    flex: 0 0 auto;
  }
  .eq-cell-body { min-width: 0; }
  .eq-cell-name {
    font-size: 10.5px;
    font-weight: 700;
    color: #ded9ee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .eq-cell-name span { font-size: 9px; font-weight: 800; margin-left: 3px; }
  .eq-cell-eff {
    font-size: 9.5px;
    color: #9d97b5;
    line-height: 1.4;
    margin-top: 2px;
    word-break: break-word;
  }

  /* ---------- 结束界面 ---------- */
  .over-panel {
    text-align: center;
    max-width: 430px;
    padding: clamp(24px, 3.6vh, 38px) clamp(20px, 3vw, 34px);
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .062), rgba(255, 255, 255, .012));
    border: 1px solid rgba(255, 255, 255, .085);
    box-shadow: 0 34px 90px -34px rgba(0, 0, 0, .95), inset 0 1px 0 rgba(255, 255, 255, .05);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  .over-kicker {
    font-size: 11px;
    letter-spacing: .42em;
    color: #8b3b52;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .over-title {
    font-size: clamp(26px, 3.2vw, 36px);
    font-weight: 900;
    letter-spacing: .1em;
    margin: 0 0 6px;
    background: linear-gradient(180deg, #ffd9e2, #b83a5a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .over-wave {
    font-size: clamp(13px, 1.2vw, 14.5px);
    color: #9b95b2;
    letter-spacing: .1em;
    margin-bottom: 8px;
  }
  .over-wave b {
    font-size: 1.7em;
    color: #f5c451;
    font-variant-numeric: tabular-nums;
    margin: 0 2px;
  }
  .over-killer {
    font-size: clamp(11px, 1vw, 12.5px);
    color: #b05a72;
    letter-spacing: .06em;
    margin-bottom: clamp(14px, 2.2vh, 20px);
  }
  .over-kills {
    font-size: 11px;
    color: #6f6a85;
    letter-spacing: .1em;
    margin: clamp(10px, 1.6vh, 14px) 0 8px;
  }
  .over-stats {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin-bottom: clamp(12px, 2vh, 18px);
    flex-wrap: wrap;
  }
  .over-chip {
    padding: 7px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .045);
    border: 1px solid rgba(255, 255, 255, .07);
    font-size: 11.5px;
    color: #9b95b2;
    font-variant-numeric: tabular-nums;
  }
  .over-chip b { color: #ddd8ee; margin-left: 5px; }
  .over-best {
    font-size: 12px;
    color: #6f6a85;
    letter-spacing: .1em;
    margin-bottom: clamp(18px, 2.8vh, 28px);
  }
  .over-best b { color: #f5c451; }

  .btn-again {
    background: linear-gradient(160deg, #ffe08a, #f5b53c 55%, #e08a1e);
    box-shadow: 0 10px 30px -8px rgba(245, 181, 60, .7), inset 0 1px 0 rgba(255, 255, 255, .5);
    width: 100%;
  }

  /* ---------- 横幅提示 ---------- */
  .banner {
    position: fixed;
    left: 50%;
    top: 22%;
    transform: translate(-50%, -50%) scale(.9);
    z-index: 40;
    font-size: clamp(20px, 3vw, 34px);
    font-weight: 900;
    letter-spacing: .3em;
    color: #ffd76e;
    text-shadow: 0 0 40px rgba(245, 196, 81, .8), 0 4px 20px rgba(0, 0, 0, .9);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .banner.play { animation: bannerIn 1.5s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes bannerIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.72); letter-spacing: .6em; }
    22% { opacity: 1; transform: translate(-50%, -50%) scale(1); letter-spacing: .3em; }
    74% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1.04); }
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 720px) {
    .eq-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .fighter { width: clamp(120px, 29vw, 162px); min-height: 32vh; padding: 12px 8px; gap: 7px; }
    .avatar { width: clamp(62px, 17vw, 84px); height: clamp(62px, 17vw, 84px); font-size: clamp(30px, 8.5vw, 42px); }
    .name { font-size: 11px; }
    .stats { gap: 4px; }
    .stat { padding: 1px 5px; font-size: 9.5px; }
    .eq-slot { flex-basis: 24px; font-size: 11px; border-radius: 6px; }
    .eq-lv { font-size: 6px; }
    .center { gap: 6px; width: 44px; }
    .vs { font-size: 13px; letter-spacing: .06em; }
    .turn-tip { display: none; }
    .cards { gap: 7px; }
    .up-card { padding: 12px 6px; gap: 5px; min-height: 0; }
    .card-rar { letter-spacing: .12em; font-size: 8.5px; }
    .card-note { display: none; }
    .card-val { font-size: 20px; }
    .btn { padding: 12px 16px; }
    .actions { gap: 8px; }
    .eq-cell { min-height: 0; padding: 6px; }
    .eq-cell-eff { font-size: 8.5px; }
  }
  @media (max-height: 620px) {
    .fighter { padding: 9px 8px; gap: 4px; min-height: 0; }
    .avatar { width: 54px; height: 54px; font-size: 28px; }
    .up-head { margin-bottom: 10px; }
    .cur-stats { margin-top: 10px; padding-top: 8px; }
    .up-card { min-height: 0; padding: 10px 8px; }
    .card-icon { margin: 2px 0 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="bg-base"></div>
<div class="bg-grid"></div>
<div class="bg-vignette"></div>

<div id="app">
  <header class="topbar">
    <div class="wave-block">
      <span class="wave-label">Wave</span>
      <span class="wave-num" id="waveNum">01</span>
    </div>
    <div class="top-right">
      <span class="record" id="recordBox">最佳 <b id="recordNum">0</b></span>
      <button class="icon-btn" id="soundBtn" title="音效开关">🔊</button>
      <button class="icon-btn" id="restartBtn" title="重新开始">↻</button>
    </div>
  </header>

  <main class="stage">
    <section class="fighter ally" id="ally">
      <div class="name-row"><span class="name" id="allyName">冒险者</span></div>
      <div class="avatar-wrap">
        <div class="aura"></div>
        <div class="avatar" id="allyAvatar">⚔️</div>
      </div>
      <div class="bar" id="allyBar">
        <div class="bar-ghost" id="allyGhost"></div>
        <div class="fill" id="allyFill"></div>
        <span class="bar-txt" id="allyBarTxt">120 / 120</span>

      <div class="stats">
        <span class="stat atk" id="allyAtkBox"><i>⚔</i><b id="allyAtk">14</b></span>
        <span class="stat def" id="allyDefBox"><i>🛡</i><b id="allyDef">4</b></span>

      <div class="eq-row" id="allyEq"></div>
      <div class="status-row" id="allyStatus"></div>
    </section>

    <div class="center">
      <div class="center-line"></div>
      <div class="vs">VS</div>

      <div class="center-line"></div>

    </div>

    <section class="fighter foe" id="foe">
      <div class="name-row"><span class="crown" id="foeCrown" style="display:none">👑</span><span class="name" id="foeName">哥布林</span></div>
      <div class="avatar-wrap">
        <div class="aura"></div>
        <div class="avatar" id="foeAvatar">👺</div>
      </div>
      <div class="bar" id="foeBar">
        <div class="bar-ghost" id="foeGhost"></div>
        <div class="fill" id="foeFill"></div>
        <span class="bar-txt" id="foeBarTxt">24 / 24</span>
      </div>
      <div class="shield-bar" id="foeShieldBar"><div class="shield-fill" id="foeShieldFill"></div></div>
      <div class="stats">
        <span class="stat atk"><i>⚔</i><b id="foeAtk">8</b></span>
        <span class="stat def"><i>🛡</i><b id="foeDef">1</b></span>
      </div>
      <div class="eq-row" id="foeEq"></div>

    </section>

  <div class="track" id="track">
    <div class="track-pips" id="trackPips"></div>

  </div>

  <footer class="actions">
    <button class="btn btn-attack" id="attackBtn">攻 击</button>
    <button class="btn btn-defend" id="defendBtn">防 御<span class="sub" id="defendSub">护盾 +36</span></button>
  </footer>
</div>

<div class="banner" id="banner"></div>

<!-- 升级弹窗 -->
<div class="overlay" id="upgradeOverlay">
  <div class="panel">
    <div class="up-head">
      <div class="up-kicker">Wave Cleared</div>

    </div>
    <div class="cards" id="cards"></div>
    <div class="cur-stats">
      <span class="cur-item"><i>❤</i> 生命 <b id="curHp">120</b></span>
      <span class="cur-item"><i>⚔</i> 攻击 <b id="curAtk">14</b></span>
      <span class="cur-item"><i>🛡</i> 防御 <b id="curDef">4</b></span>

      <span class="over-chip">生命<b id="overHp">120</b></span>

    <button class="btn btn-again" id="againBtn">再次挑战</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     数值配置（全部整数）
     ========================================================= */
  const CFG = {
    player: { hp: 120, atk: 14, def: 4 },

    // 属性升级：白 / 绿 / 蓝 / 紫 / 金
    attr: {
      hp:  { label: '生命', icon: '❤', vals: [19, 36, 59, 90, 138], note: '提升生命上限，并立即恢复等量生命' },
      atk: { label: '攻击', icon: '⚔', vals: [6, 9, 13, 20, 29],    note: '每次攻击造成更高伤害' },
      def: { label: '防御', icon: '🛡', vals: [2, 3, 4, 6, 9],      note: '减免受到的伤害，并提升防御护盾' }
    },

    // 怪物成长曲线
    mon: {
      hp0: 24, hpK: 4.5, hpQ: 0.055,
      atk0: 8, atkK: 1.05, atkQ: 0.019,
      def0: 1, defK: 0.55,
      bossHp: 1.45, bossAtk: 1.05,
      eqEvery: 4,        // 每 N 波获得一件装备
      bleedMul: 0.8      // 怪物流血强度系数
    },

    heal: { min: 12, pct: 0.24, base: 18, perWave: 2.6 },
    defend: { base: 8, defMul: 2.4, capPct: 0.5, decay: 0.7 },
    rage: { start: 14, per: 0.12 },
    forge: { maxLevel: 5 }
  };

  const RARITY = [
    { key: 'white',  name: '普通', c: '#c9d1e0', w: w => Math.max(10, 44 - 1.5 * w) },
    { key: 'green',  name: '精良', c: '#4ade80', w: () => 30 },
    { key: 'blue',   name: '稀有', c: '#48b8f8', w: w => 13 + 0.4 * w },
    { key: 'purple', name: '史诗', c: '#a78bfa', w: w => 6 + 0.4 * w },
    { key: 'gold',   name: '传说', c: '#fbbf24', w: w => Math.min(10, 1 + 0.2 * w) }
  ];

  const SLOTS = [
    { key: 'weapon',  name: '武器', icon: '⚔',  statK: 'atk' },
    { key: 'armor',   name: '护甲', icon: '🛡',  statK: 'def' },
    { key: 'helm',    name: '头盔', icon: '⛑',  statK: 'hp' },
    { key: 'trinket', name: '饰品', icon: '💠',  statK: null }
  ];

  /* ---------- 装备定义 ----------
     stat：各稀有度的基础属性加成；step：每级追加
     mk(r, L0)：按稀有度索引与等级偏移算出具体效果数值
  ------------------------------------- */
  const ITEM_DEFS = {
    weapon: [
      {
        k: 'bleed', name: '血刃', icon: '🗡️', stat: [2, 3, 5, 8, 12], step: 2,
        mk: (r, L0) => ({
          dmg: Math.round([2, 3, 5, 7, 10][r] + 2 * L0),
          turns: [3, 3, 4, 4, 5][r] + Math.floor(L0 / 2)
        }),
        desc: v => '命中后附加流血：每回合 <em>' + v.dmg + '</em> 点，持续 <em>' + v.turns + '</em> 回合',
        tag: v => '流血 ' + v.dmg + ' × ' + v.turns

  /* =========================================================

     ========================================================= */
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(opt) {
    if (muted) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const { freq = 220, type = 'sine', dur = 0.12, vol = 0.14, slide = null, delay = 0 } = opt;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  /* =========================================================
     装备逻辑
     ========================================================= */
  function rarOf(idx) { return RARITY[clamp(idx, 0, 4)]; }

  function buildItem(slotKey, defIdx, rarIdx, level) {
    const def = ITEM_DEFS[slotKey][defIdx];
    const slot = SLOTS.find(s => s.key === slotKey);
    const L0 = level - 1;
    const item = {
      slot: slotKey,
      slotName: slot.name,
      def: def,
      key: def.k,
      name: def.name,
      icon: def.icon,
      rarity: clamp(rarIdx, 0, 4),
      level: level,
      statK: def.stat ? (def.statK || slot.statK) : null,
      statV: def.stat ? Math.round(def.stat[clamp(rarIdx, 0, 4)] + (def.step || 0) * L0) : 0,
      eff: def.mk(clamp(rarIdx, 0, 4), L0)
    };
    item.c = rarOf(item.rarity).c;
    return item;
  }

  function randomItem(slotKey, rarIdx) {
    return buildItem(slotKey, Math.floor(Math.random() * ITEM_DEFS[slotKey].length), rarIdx, 1);
  }

  function itemDesc(item) {
    const d = item.def.desc(item.eff, item);
    const statLine = item.statV > 0
      ? '<em>+' + item.statV + ' ' + { atk: '攻击', def: '防御', hp: '生命' }[item.statK] + '</em>'
      : '';
    return statLine ? statLine + '<br>' + d : d;
  }

  function itemDescText(item) {
    return itemDesc(item).replace(/<br>/g, '，').replace(/<\/?em>/g, '');
  }

  function aggregate(items) {
    const A = {
      atkFlat: 0, defFlat: 0, hpFlat: 0,
      bleed: null, crit: 0, critMult: 1.6, leech: 0, thorn: 0,
      guard: 0, bulwark: 0, vamp: 0, dotres: 0, shieldstart: 0, pierce: 0
    };
    items.forEach(it => {
      if (it.statK === 'atk') A.atkFlat += it.statV;
      else if (it.statK === 'def') A.defFlat += it.statV;
      else if (it.statK === 'hp') A.hpFlat += it.statV;

      const e = it.eff;
      switch (it.key) {
        case 'bleed':
          if (!A.bleed || e.dmg > A.bleed.dmg) A.bleed = { dmg: e.dmg, turns: e.turns };
          break;
        case 'crit':
          A.crit += e.chance;
          A.critMult = Math.max(A.critMult, e.mult);
          break;
        case 'leech': A.leech += e.pct; break;
        case 'thorn': A.thorn += e.dmg; break;
        case 'guard': A.guard += e.shield; break;
        case 'bulwark': A.bulwark += e.pct; break;
        case 'vamp': A.vamp += e.pct; break;
        case 'dotres': A.dotres += e.pct; break;
        case 'shieldstart': A.shieldstart += e.shield; break;
        case 'pierce': A.pierce += e.pct; break;
      }
    });
    return A;
  }

  function recalc(u) {
    const oldMax = u.maxHp || 0;
    u.atk = u.baseAtk + u.agg.atkFlat;
    u.def = u.baseDef + u.agg.defFlat;
    u.maxHp = u.baseHp + u.agg.hpFlat;
    if (oldMax > 0) {
      if (u.maxHp > oldMax) u.hp += (u.maxHp - oldMax);
      u.hp = Math.min(u.hp, u.maxHp);
    } else {
      u.hp = u.maxHp;
    }
  }

  function refresh(u) {
    u.agg = aggregate(u.items);
    recalc(u);
  }

  function itemAt(u, slotKey) {
    return u.items.find(i => i.slot === slotKey) || null;
  }

  /* =========================================================

     ========================================================= */
  function dealDamage(target, dmg) {
    let d = dmg;
    if (target.shield > 0) {
      const absorbed = Math.min(target.shield, d);
      target.shield -= absorbed;
      d -= absorbed;
    }
    target.hp = Math.max(0, target.hp - d);
    return d;   // 实际打到生命上的伤害
  }

  function healUnit(u, amount) {
    if (amount <= 0) return 0;
    const before = u.hp;
    u.hp = Math.min(u.maxHp, u.hp + amount);
    return u.hp - before;
  }

  function strike(attacker, defender) {
    const A = attacker.agg, D = defender.agg;

    const effDef = defender.def * (1 - Math.min(60, A.pierce) / 100);
    let dmg = Math.max(attacker.atk - effDef, attacker.atk * 0.15);

    let crit = false;
    if (A.crit > 0 && Math.random() * 100 < A.crit) {
      dmg *= A.critMult;
      crit = true;
    }
    dmg = dmg * (0.94 + Math.random() * 0.12);
    if (D.bulwark > 0) dmg *= (1 - Math.min(60, D.bulwark) / 100);
    dmg = Math.max(1, Math.round(dmg));

    const shieldBefore = defender.shield;
    const applied = dealDamage(defender, dmg);

    // 吸血（攻击方）
    if (A.leech > 0 && applied > 0) {
      const h = healUnit(attacker, Math.floor(applied * A.leech / 100));
      if (h > 0 && attacker === state.player) floatNum(allyHost(), '+' + h, 'heal');
    }
    // 受伤回复（防守方）
    if (D.vamp > 0 && applied > 0 && defender.hp > 0) {
      const h = healUnit(defender, Math.max(1, Math.floor(applied * D.vamp / 100)));
      if (h > 0 && defender === state.player) floatNum(allyHost(), '+' + h, 'heal');
    }
    // 荆棘反伤
    if (D.thorn > 0 && attacker.hp > 0) {
      attacker.hp = Math.max(0, attacker.hp - D.thorn);
      floatNum(attacker === state.player ? allyHost() : foeHost(), '-' + D.thorn, 'hurt');
    }
    // 施加流血
    if (A.bleed && defender.hp > 0) {
      const mul = attacker.isMon ? CFG.mon.bleedMul : 1;
      const bd = Math.max(1, Math.round(A.bleed.dmg * mul));
      if (!defender.bleed || bd >= defender.bleed.dmg) {
        defender.bleed = { dmg: bd, turns: A.bleed.turns };
      } else {
        defender.bleed.turns = Math.max(defender.bleed.turns, A.bleed.turns);
      }
    }

    return { dmg, applied, crit, absorbed: shieldBefore > 0 && applied === 0 };
  }

  function doDefend(u) {
    const cap = Math.floor(u.maxHp * CFG.defend.capPct);
    const gain = Math.min(defendValue(u), Math.max(0, cap - u.shield));
    u.shield = Math.min(cap, u.shield + defendValue(u));
    u.defended = true;
    return defendValue(u);
  }

  function tickBleed(u) {
    if (!u.bleed) return 0;
    let d = u.bleed.dmg;
    if (u.agg.dotres > 0) d = Math.max(1, Math.round(d * (1 - Math.min(80, u.agg.dotres) / 100)));
    u.hp = Math.max(0, u.hp - d);        // 流血无视护盾
    u.bleed.turns -= 1;
    if (u.bleed.turns <= 0) u.bleed = null;
    return d;
  }

  /* =========================================================
     怪物
     ========================================================= */
  function makeMonster(wave) {
    const n = wave - 1;
    const C = CFG.mon;
    let maxHp = C.hp0 + C.hpK * n + C.hpQ * n * n;
    let atk = C.atk0 + C.atkK * n + C.atkQ * n * n;
    let def = C.def0 + C.defK * n;

    const isBoss = wave % 5 === 0;
    if (isBoss) {
      maxHp *= C.bossHp;
      atk *= C.bossAtk;
    }

    let name, emoji;
    if (isBoss) {
      const b = BOSS_POOL[(Math.floor(wave / 5) - 1) % BOSS_POOL.length];
      name = b.name;
      emoji = b.emoji;
    } else {
      const t = pick(MONSTER_POOL);
      name = pick(PREFIX) + pick(t.names);
      emoji = t.emoji;
    }

    const u = makeUnit({ hp: Math.round(maxHp), atk: Math.round(atk), def: Math.round(def) });
    u.isMon = true;
    u.boss = isBoss;
    u.name = name;
    u.emoji = emoji;

    // 随波次获得装备
    const count = Math.min(4, Math.floor((wave - 1) / C.eqEvery));
    const pool = SLOTS.map(s => s.key);
    for (let i = 0; i < count; i++) {
      const slotKey = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      const rar = clamp(Math.floor(wave / 7) + (Math.random() < 0.4 ? 1 : 0), 0, 4);
      u.items.push(randomItem(slotKey, rar));
    }
    refresh(u);
    u.hp = u.maxHp;
    u.shield = 0;
    return u;
  }

  function renderMonster() {
    const m = state.monster;
    el.foeName.textContent = m.name;
    el.foeAvatar.textContent = m.emoji;
    el.foeCrown.style.display = m.boss ? '' : 'none';
    el.foe.classList.toggle('boss', !!m.boss);
  }

  /* =========================================================
     升级卡池
     ========================================================= */
  function rollRarity(wave) {
    const weights = RARITY.map(r => r.w(wave));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < RARITY.length; i++) {
      r -= weights[i];
      if (r <= 0) return i;
    }
    return 0;
  }

  function makeCards(wave) {
    const p = state.player;
    const pool = [];

    ['hp', 'atk', 'def'].forEach(attr => {
      const ri = rollRarity(wave);
      pool.push({ t: 'attr', key: 'a:' + attr, attr, ri, val: CFG.attr[attr].vals[ri], w: 12 });
    });

    SLOTS.forEach(slot => {
      const it = itemAt(p, slot.key);
      if (!it) {
        const ri = rollRarity(wave);
        const defIdx = Math.floor(Math.random() * ITEM_DEFS[slot.key].length);
        pool.push({ t: 'equip', key: 's:' + slot.key, slot: slot.key, defIdx, ri, w: 11 });
      } else if (it.level < CFG.forge.maxLevel) {
        pool.push({ t: 'forge', key: 's:' + slot.key, slot: slot.key, item: it, w: 10 });
      } else if (it.rarity < 4) {
        pool.push({ t: 'ascend', key: 's:' + slot.key, slot: slot.key, item: it, w: 7 });
      }
    });

    // 加权抽 3 张（同槽位不重复）
    const out = [];
    let left = pool.slice();
    while (out.length < 3 && left.length) {
      const total = left.reduce((a, b) => a + b.w, 0);
      let r = Math.random() * total;
      let idx = 0;
      for (let i = 0; i < left.length; i++) {
        r -= left[i].w;
        if (r <= 0) { idx = i; break; }
      }
      const card = left[idx];
      out.push(card);
      left = left.filter(c => c.key !== card.key);
    }

    // 保证至少一张属性卡
    if (out.length && !out.some(c => c.t === 'attr')) {
      const attr = pick(['hp', 'atk', 'def']);
      const ri = rollRarity(wave);
      out[Math.floor(Math.random() * out.length)] = {
        t: 'attr', key: 'a:' + attr, attr, ri, val: CFG.attr[attr].vals[ri]
      };
    }
    return out;
  }

  const ATTR_ICON = {
    hp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
    atk: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.9 14.55 8.2v6.75h-5.1V8.2L12 1.9z"/><path d="M6.9 15.55h10.2v2.15H6.9z"/><path d="M10.6 17.7h2.8v4.4h-2.8z"/></svg>',
    def: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.7 3.5 5v6.3c0 5.15 3.55 9.75 8.5 11.3 4.95-1.55 8.5-6.15 8.5-11.3V5L12 1.7z"/></svg>'
  };

  function cardRarityClass(ri) {
    return ri === 4 ? ' gold' : '';
  }

  function renderCard(card) {
    const node = document.createElement('div');
    node.className = 'up-card';

    if (card.t === 'attr') {
      const meta = CFG.attr[card.attr];
      const rar = rarOf(card.ri);
      node.classList.add('up-card');
      if (card.ri === 4) node.classList.add('gold');
      node.style.setProperty('--c', rar.c);
      node.innerHTML =
        '<div class="card-rar">' + rar.name + '</div>' +
        '<div class="card-icon">' + ATTR_ICON[card.attr] + '</div>' +
        '<div class="card-name">' + meta.label + '</div>' +
        '<div class="card-val">+' + card.val + '</div>' +
        '<div class="card-note">' + meta.note + '</div>';
      return node;
    }

    if (card.t === 'equip') {
      const rar = rarOf(card.ri);
      const slot = SLOTS.find(s => s.key === card.slot);
      const it = buildItem(card.slot, card.defIdx, card.ri, 1);
      node.className = 'up-card' + cardRarityClass(card.ri);
      node.style.setProperty('--c', rar.c);
      node.innerHTML =
        '<div class="card-rar">' + rar.name + ' · ' + slot.name + '</div>' +
        '<div class="card-icon">' + it.icon + '</div>' +
        '<div class="card-name">' + it.name + '</div>' +
        '<div class="card-eff">' + itemDesc(it) + '</div>' +
        '<div class="card-tag">装备 ' + slot.name + '位</div>';
      return node;
    }

    if (card.t === 'forge') {
      const it = card.item;
      const next = buildItem(it.slot, ITEM_DEFS[it.slot].indexOf(it.def), it.rarity, it.level + 1);
      node.className = 'up-card';
      node.style.setProperty('--c', it.c);
      node.innerHTML =
        '<div class="card-rar">强化 · ' + it.slotName + '</div>' +
        '<div class="card-icon">' + it.icon + '</div>' +
        '<div class="card-name">' + it.name + ' <span style="color:' + it.c + '">Lv.' + it.level + ' → ' + next.level + '</span></div>' +
        '<div class="card-eff">' + itemDesc(next) + '</div>' +
        '<div class="card-tag">强化现有装备</div>';
      return node;
    }

    // ascend
    const it = card.item;
    const newRar = rarOf(it.rarity + 1);
    const next = buildItem(it.slot, ITEM_DEFS[it.slot].indexOf(it.def), it.rarity + 1, 1);
    node.className = 'up-card' + (it.rarity + 1 === 4 ? ' gold' : '');
    node.style.setProperty('--c', newRar.c);
    node.innerHTML =
      '<div class="card-rar">升华 · ' + newRar.name + '</div>' +
      '<div class="card-icon">' + it.icon + '</div>' +
      '<div class="card-name">' + it.name + ' <span style="color:' + newRar.c + '">' + rarOf(it.rarity).name + ' → ' + newRar.name + '</span></div>' +
      '<div class="card-eff">' + itemDesc(next) + '</div>' +
      '<div class="card-tag">稀有度提升，等级重置为 1</div>';
    return node;
  }

  function renderEqPanel() {
    el.eqPanel.innerHTML = '';
    SLOTS.forEach(slot => {
      const it = itemAt(state.player, slot.key);
      const cell = document.createElement('div');
      cell.className = 'eq-cell' + (it ? '' : ' empty');
      if (it) {
        const rar = rarOf(it.rarity);
        cell.innerHTML =
          '<div class="eq-cell-ic">' + it.icon + '</div>' +
          '<div class="eq-cell-body">' +
            '<div class="eq-cell-name">' + it.name +
              '<span style="color:' + rar.c + '">Lv.' + it.level + '</span></div>' +
            '<div class="eq-cell-eff">' + itemDescText(it) + '</div>' +
          '</div>';
      } else {
        cell.innerHTML =
          '<div class="eq-cell-ic" style="opacity:.5">' + slot.icon + '</div>' +
          '<div class="eq-cell-body">' +
            '<div class="eq-cell-name" style="color:#6f6a85">' + slot.name + '空置</div>' +
            '<div class="eq-cell-eff">战利品可填补此位</div>' +
          '</div>';
      }
      el.eqPanel.appendChild(cell);
    });
  }

  function showUpgrade() {
    state.phase = 'upgrade';
    el.upSub.textContent = '第 ' + state.wave + ' 波已征服 · 从三项中选择一项';
    el.curHp.textContent = fmt(state.player.maxHp);
    el.curAtk.textContent = fmt(state.player.atk);
    el.curDef.textContent = fmt(state.player.def);

    const cards = makeCards(state.wave);
    el.cards.innerHTML = '';
    cards.forEach(card => {
      const node = renderCard(card);
      node.addEventListener('click', () => chooseUpgrade(card, node));
      el.cards.appendChild(node);
    });

    renderEqPanel();
    el.upOverlay.classList.add('show');
    sfxUpgrade();
  }

  async function chooseUpgrade(card, node) {
    if (state.phase !== 'upgrade') return;
    state.phase = 'busy';

    Array.from(el.cards.children).forEach(c => {
      if (c === node) c.classList.add('picked');
      else c.classList.add('dim');
    });

    const p = state.player;
    let justSlot = null;

    if (card.t === 'attr') {
      if (card.attr === 'hp') {
        p.baseHp += card.val;
        p.hp += card.val;
      } else if (card.attr === 'atk') {
        p.baseAtk += card.val;
      } else {
        p.baseDef += card.val;
      }
      refresh(p);
    } else if (card.t === 'equip') {
      p.items.push(buildItem(card.slot, card.defIdx, card.ri, 1));
      refresh(p);
      justSlot = card.slot;
    } else if (card.t === 'forge') {
      const it = card.item;
      const defIdx = ITEM_DEFS[it.slot].indexOf(it.def);
      const idx = p.items.indexOf(it);
      p.items[idx] = buildItem(it.slot, defIdx, it.rarity, it.level + 1);
      refresh(p);
      justSlot = it.slot;
    } else {
      const it = card.item;
      const defIdx = ITEM_DEFS[it.slot].indexOf(it.def);
      const idx = p.items.indexOf(it);
      p.items[idx] = buildItem(it.slot, defIdx, it.rarity + 1, 1);
      refresh(p);
      justSlot = it.slot;
    }

    tone({ freq: 660, type: 'sine', dur: 0.18, vol: 0.1 });
    await sleep(520);

    el.upOverlay.classList.remove('show');
    await sleep(260);

    state.wave += 1;
    startWave(justSlot);
  }

  /* =========================================================
     流程
     ========================================================= */
  function startWave(justSlot) {
    state.monster = makeMonster(state.wave);
    state.round = 0;
    state.phase = 'battle';

    const p = state.player;
    p.shield = Math.min(Math.floor(p.maxHp * CFG.defend.capPct), p.agg.shieldstart || 0);
    p.bleed = null;
    p.defended = false;

    renderWave();
    renderMonster();
    render();
    if (justSlot) renderEquip(el.allyEq, p, justSlot);
    setTip('你的回合');

    if (state.monster.boss) {
      showBanner('BOSS 来袭');
      sfxBoss();
    }
  }

  function monsterChooseAction() {
    const m = state.monster;
    const low = m.hp / m.maxHp < 0.35;
    if (low && Math.random() < 0.4) return 'defend';
    return 'attack';
  }

  async function doRound(action) {
    if (state.phase !== 'battle') return;
    state.phase = 'busy';
    renderButtons();

    const p = state.player;
    const m = state.monster;
    state.round += 1;

    /* ---- 玩家行动 ---- */
    if (action === 'attack') {
      el.ally.classList.add('lunge');
      setTip('攻击');
      sfxHit(false);
      await sleep(180);
      el.ally.classList.remove('lunge');

      const res = strike(p, m);
      if (res.crit) sfxHit(true);
      el.foe.classList.add('hit', 'flash-dmg');
      floatNum(foeHost(), (res.absorbed ? '格挡 ' : '') + '-' + res.dmg, res.absorbed ? 'block' : (res.crit ? 'crit' : 'dmg'));
      impact(false);
      render();
      await sleep(280);
      el.foe.classList.remove('hit', 'flash-dmg');
    } else {
      const gain = doDefend(p);
      el.ally.classList.add('guard');
      setTip('防御');
      sfxGuard();
      floatNum(allyHost(), '+' + gain + ' 护盾', 'shield');
      render();
      await sleep(340);
      el.ally.classList.remove('guard');
    }

    if (m.hp <= 0) { await onVictory(); return; }

    /* ---- 怪物行动 ---- */
    setTip('敌方回合');
    await sleep(140);

    const mAct = monsterChooseAction();
    if (mAct === 'defend') {
      const gain = doDefend(m);
      el.foe.classList.add('guard');
      floatNum(foeHost(), '+' + gain + ' 护盾', 'shield');
      render();
      await sleep(320);
      el.foe.classList.remove('guard');
    } else {
      el.foe.classList.add('lunge');
      await sleep(170);
      el.foe.classList.remove('lunge');

      const res = strike(m, p);
      el.ally.classList.add('hit', 'flash-dmg');
      floatNum(allyHost(), (res.absorbed ? '格挡 ' : '') + '-' + res.dmg, res.absorbed ? 'block' : 'hurt');
      impact(true);
      sfxHurt();
      render();
      await sleep(300);
      el.ally.classList.remove('hit', 'flash-dmg');
    }

    if (p.hp <= 0) { gameOver(); return; }

    /* ---- 回合结束：流血 / 护盾衰减 ---- */
    await sleep(120);

    const bm = tickBleed(m);
    if (bm > 0) {
      floatNum(foeHost(), '-' + bm + ' 流血', 'dot');
      sfxTick();
      render();
      await sleep(240);
    }
    if (m.hp <= 0) { await onVictory(); return; }

    const bp = tickBleed(p);
    if (bp > 0) {
      floatNum(allyHost(), '-' + bp + ' 流血', 'dot');
      sfxTick();
      render();
      await sleep(220);
    }
    if (p.hp <= 0) { gameOver(); return; }

    if (!p.defended && p.shield > 0) p.shield = Math.floor(p.shield * CFG.defend.decay);
    if (!m.defended && m.shield > 0) m.shield = Math.floor(m.shield * CFG.defend.decay);
    p.defended = false;
    m.defended = false;

    render();
    state.phase = 'battle';
    setTip(state.round >= CFG.rage.start ? '第 ' + state.round + ' 回合 · 敌方狂暴' : '你的回合', state.round >= CFG.rage.start);
    renderButtons();
  }

  async function onVictory() {
    state.phase = 'busy';
    renderButtons();

    el.foe.classList.add('dying');
    sfxWin();
    setTip('胜利');
    render();

    const p = state.player;
    const healAmt = Math.round(Math.max(
      CFG.heal.min,
      Math.min(p.maxHp * CFG.heal.pct, CFG.heal.base + CFG.heal.perWave * (state.wave - 1))
    ));

    await sleep(620);
    el.foe.classList.remove('dying');

    const gained = healUnit(p, healAmt);
    if (gained > 0) floatNum(allyHost(), '+' + gained, 'heal');
    render();

    await sleep(500);
    showUpgrade();
  }

  function gameOver() {
    state.phase = 'over';
    renderButtons();
    setTip('你倒下了', true);
    sfxLose();

    if (state.wave > state.best) {
      state.best = state.wave;
      try { localStorage.setItem('abyss_best', String(state.best)); } catch (e) {}
    }
    el.recordNum.textContent = state.best;

    const p = state.player;
    setTimeout(() => {
      el.overWave.textContent = state.wave;
      el.overKiller.textContent = '被「' + (state.monster ? state.monster.name : '深渊') + '」击败';
      el.overHp.textContent = fmt(p.maxHp);
      el.overAtk.textContent = fmt(p.atk);
      el.overDef.textContent = fmt(p.def);
      el.overEq.textContent = p.items.length + ' / 4';
      el.overKills.textContent = '击败 ' + Math.max(0, state.wave - 1) + ' 个敌人';
      el.overBest.innerHTML = '最佳纪录：第 <b>' + state.best + '</b> 波';
      el.overOverlay.classList.add('show');
    }, 420);
  }

  function resetGame() {
    el.upOverlay.classList.remove('show');
    el.overOverlay.classList.remove('show');
    el.ally.classList.remove('hit', 'flash-dmg', 'lunge', 'guard');
    el.foe.classList.remove('hit', 'flash-dmg', 'lunge', 'dying', 'guard');

    state.wave = 1;
    state.round = 0;
    state.player = makeUnit(CFG.player);
    state.monster = null;
    state.phase = 'battle';

    el.recordNum.textContent = state.best;
    el.allyAvatar.textContent = '⚔️';
    startWave();
  }

  /* =========================================================
     事件
     ========================================================= */
  el.attackBtn.addEventListener('click', () => doRound('attack'));
  el.defendBtn.addEventListener('click', () => doRound('defend'));
  el.againBtn.addEventListener('click', resetGame);
  el.restartBtn.addEventListener('click', () => {
    if (state.phase === 'busy') return;
    resetGame();
  });

  el.soundBtn.addEventListener('click', () => {
    muted = !muted;
    el.soundBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) tone({ freq: 660, type: 'sine', dur: 0.1, vol: 0.08 });
  });

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      doRound('attack');
    } else if (e.key === 'd' || e.key === 'D' || e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      doRound('defend');
    } else if (e.key === 'r' || e.key === 'R') {
      if (state.phase !== 'busy') resetGame();
    }
  });

  /* =========================================================
     启动
     ========================================================= */
  if (state.best > 0) el.recordNum.textContent = state.best;
  buildTrack();
  state.player = makeUnit(CFG.player);
  startWave();
})();
</script>
